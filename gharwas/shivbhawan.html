<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gharwas – Shiv Bhawan (TV screen)</title>
<style>
/* 16:9 TV screen (53" = 1920x1080). Pure HTML+CSS, no JS, no network. Everything is sized in em;
   1em = 1% of the stage width, so it scales to any 16:9 screen. Open full screen (F11 / TV browser). */
:root{--g:#f5c542;--cream:#fff3d6;--d:#3b0710}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#1a0307;overflow:hidden}
body{display:grid;place-items:center;font-family:"Noto Sans Devanagari","Mukta",Georgia,serif;color:var(--cream)}
.stage{width:min(100vw,177.78vh);aspect-ratio:16/9;font-size:min(1vw,1.7778vh);position:relative;
 background:radial-gradient(ellipse at 50% 0,#a3182d,var(--d) 72%);padding:2.5em;
 display:grid;grid-template-columns:22em 1fr 34em;grid-template-rows:100%;gap:2.5em;overflow:hidden}
.stage>*{min-height:0}
.stage::before{content:"";position:absolute;inset:.9em;border:.15em solid var(--g);border-radius:1.2em;pointer-events:none;
 box-shadow:inset 0 0 0 .5em var(--d),inset 0 0 0 .6em #f5c54288}
.frame{position:relative;border:.25em solid var(--g);border-radius:1em;overflow:hidden;box-shadow:0 0 2em #000a,0 0 1.2em #f5c54255}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:2.2em .6em .6em;text-align:center;font-weight:700;font-size:1.5em;
 background:linear-gradient(transparent,#1a0307ee);text-shadow:0 .1em .3em #000}
/* left: Shiv */
.shiv{align-self:center;height:44em}
.shiv .cap{color:var(--g);font-size:1.9em}
/* middle */
.mid{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:.8em 0}
.top{font-size:1.7em;color:var(--g);letter-spacing:.15em}
.wel{font-size:4.6em;font-weight:800;color:var(--g);line-height:1.1;text-shadow:0 .06em .3em #000}
.en{font-size:1.8em;letter-spacing:.05em}
.name{font-size:3.7em;font-weight:800;line-height:1.05;color:#fff;text-shadow:0 0 .5em #f5c54299,0 .05em .2em #000}
.name small{font-size:.55em;font-weight:600;letter-spacing:.2em;color:var(--g);display:block}
.house{width:100%;aspect-ratio:16/9;max-height:19em;flex:none}
.house img{object-position:50% 60%}
.bhoj{width:100%;background:#fff3d6;color:#5a0a18;border-radius:1em;border:.2em solid var(--g);padding:.7em 1em;box-shadow:0 0 1.2em #0008}
.bhoj b{display:block;font-size:2.1em;line-height:1.15}
.bhoj span{display:block;font-size:1.9em;font-weight:700;line-height:1.3}
.bhoj i{display:block;font-size:1.4em;font-style:normal;margin-top:.1em}
/* right: parents + family */
.right{display:flex;flex-direction:column;justify-content:center;gap:1.3em}
.right .frame{width:100%;flex:none}
.par{aspect-ratio:1.15}.par img{object-position:50% 50%}
.fam{aspect-ratio:3490/1400}
@media (prefers-reduced-motion:no-preference){.name{animation:glow 4s ease-in-out infinite alternate}}
@keyframes glow{to{text-shadow:0 0 .9em #f5c542cc,0 .05em .2em #000}}
[hidden]{display:none!important}
#yt{position:fixed;left:0;bottom:0;width:320px;height:180px;opacity:0;pointer-events:none}
#snd{position:fixed;left:1.2em;bottom:1.2em;z-index:5;font-size:1.2em;color:#3b0710;background:var(--g);border:0;border-radius:50%;width:2em;height:2em;opacity:.35;cursor:pointer}
#nav{position:fixed;left:4em;bottom:1.2em;z-index:5;display:flex;gap:.6em}
#snd[hidden]+#nav{left:1.2em}
#nav{opacity:0;pointer-events:none;transition:opacity .4s}
#nav.show{opacity:1;pointer-events:auto}
#prv,#nxt{font-family:inherit;font-weight:700;font-size:1.15em;color:#3b0710;background:var(--g);border:0;border-radius:2em;padding:.5em 1.1em;opacity:.9;cursor:pointer;white-space:nowrap}
#snd:focus,#snd:hover,#prv:focus,#prv:hover,#nxt:focus,#nxt:hover{opacity:1}
/* gentle animation (CSS only; off when the device asks for reduced motion) */
@media (prefers-reduced-motion:no-preference){
 .stage>*,.top,.wel,.en,.name{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
 .stage>.mid{animation:none}
 .top{animation-delay:.2s}.wel{animation-delay:.5s}.en{animation-delay:.8s}.name{animation:rise 1.2s 1s both,glow 4s 2.2s ease-in-out infinite alternate}
 .house{animation:rise 1.2s 1.2s both}.bhoj{animation:rise 1.2s 1.5s both}
 .shiv{animation:rise 1.2s .1s both,aura 4s 1.3s ease-in-out infinite alternate}
 .right .par{animation:rise 1.2s .6s both}.right .fam{animation:rise 1.2s 1s both}
 .house img{animation:kb 22s ease-in-out infinite alternate}
 .par img{animation:kb 26s ease-in-out infinite alternate}
 .fam img{animation:kb 30s ease-in-out infinite alternate}
 .bhoj{position:relative;overflow:hidden}
 .bhoj::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,#ffffffaa,transparent);animation:sweep 6s 3s ease-in-out infinite}
 .stage::before{animation:rim 5s ease-in-out infinite alternate}
}
@keyframes rise{from{opacity:0;transform:translateY(2em)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes aura{from{box-shadow:0 0 2em #000a,0 0 1em #f5c54255}to{box-shadow:0 0 2em #000a,0 0 3.2em #f5c542cc}}
@keyframes sweep{0%{left:-40%}35%,100%{left:130%}}
@keyframes rim{from{border-color:#f5c542aa}to{border-color:#fff3d6}}
/* diyas beside the welcome heading */
.wel{display:flex;align-items:center;justify-content:center;gap:.5em}
.diya{position:relative;flex:none;width:.62em;height:.52em;font-size:1.35em}
.diya::before{content:"";position:absolute;left:0;right:0;bottom:0;height:.22em;background:linear-gradient(#ffe08a,#c07a1c 70%,#8a4f0f);border-radius:.05em .05em .6em .6em/.05em .05em .22em .22em;box-shadow:0 .03em .12em #000a}
.diya::after{content:"";position:absolute;left:50%;bottom:.1em;width:1.5em;height:1.5em;margin:0 0 -.45em -.75em;background:radial-gradient(circle,#ffb02e88,transparent 65%);pointer-events:none}
.diya i{position:absolute;left:50%;bottom:.19em;width:.17em;height:.3em;margin-left:-.085em;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:50% 92%;
 background:radial-gradient(ellipse at 50% 78%,#fff9d0 0 22%,#ffd84d 45%,#ff8a1f 78%,transparent 100%);filter:drop-shadow(0 0 .12em #ffb02e)}
@media (prefers-reduced-motion:no-preference){
 .diya i{animation:flick 1.3s infinite ease-in-out}
 .diya:last-child i{animation-duration:1.7s;animation-delay:-.6s}
 .diya::after{animation:halo 2.2s infinite ease-in-out}
}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}12%{transform:scale(.93,1.08) skewX(-4deg)}27%{transform:scale(1.06,.94) skewX(3deg)}41%{transform:scale(.95,1.1) skewX(-2deg)}58%{transform:scale(1.04,.97) skewX(5deg)}73%{transform:scale(.97,1.06) skewX(-3deg)}100%{transform:scale(1,1) skewX(0)}}
@keyframes halo{0%,100%{opacity:.75;transform:scale(1)}30%{opacity:1;transform:scale(1.12)}60%{opacity:.6;transform:scale(.94)}}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
/* family strip slideshow: the 4 photos, then moments from today; pure CSS, 3s each, 0.6s crossfade */
.fam img.sl{opacity:0}.fam img.sl:first-child{opacity:1}
@keyframes slide{0%{opacity:0}2.0%{opacity:1}10.0%{opacity:1}12.0%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:no-preference){.fam img.sl{animation:slide 30s linear infinite both}}
</style></head><body>
<main class="stage">
 <section class="frame shiv"><img src="img/shiv.jpg?v=3" alt="Bhagwan Shiv"><div class="cap">ॐ नमः शिवाय</div></section>

 <section class="mid">
  <div class="top">॥ श्री गणेशाय नमः ॥</div>
  <div class="wel"><span class="diya"><i></i></span>स्वागतम्<span class="diya"><i></i></span></div>
  <div class="en">Welcome to the Gharwas of</div>
  <div class="name">शिव भवन<small>SHIV BHAWAN</small></div>
  <div class="frame house"><img src="img/house-new.jpg?v=5" alt="Shiv Bhawan"></div>
  <div class="bhoj"><b>प्रीतिभोज</b><span>23.11.2026, सोमवार · संध्या 6 बजे से</span><i>स्थान: कुम्हड़ी, कटिहार &nbsp;|&nbsp; विनीत: पंकज कुमार सिंह</i></div>
 </section>

 <section class="right">
  <div class="frame par"><img src="img/parents-new.jpg?v=7" alt="Mata-Pita"><div class="cap">माता-पिता का आशीर्वाद 🙏</div></div>
  <div class="frame fam"><img class="sl" src="img/family-v2.jpg?v=12" alt="Pankaj Kumar Singh and family" style="animation-delay:-0.6s"><img class="sl" src="img/fam-1.jpg?v=13" alt="Family moments" style="animation-delay:3s"><img class="sl" src="img/fam-8.jpg?v=14" alt="Family moments" style="animation-delay:6s"><img class="sl" src="img/fam-2.jpg?v=13" alt="Family moments" style="animation-delay:9s"><img class="sl" src="img/fam-3.jpg?v=13" alt="Family moments" style="animation-delay:12s"><img class="sl" src="img/fam-9.jpg?v=14" alt="Family moments" style="animation-delay:15s"><img class="sl" src="img/fam-4.jpg?v=13" alt="Family moments" style="animation-delay:18s"><img class="sl" src="img/fam-5.jpg?v=13" alt="Family moments" style="animation-delay:21s"><img class="sl" src="img/fam-6.jpg?v=13" alt="Family moments" style="animation-delay:24s"><img class="sl" src="img/fam-7.jpg?v=13" alt="Family moments" style="animation-delay:27s"><div class="cap">पंकज कुमार सिंह एवं समस्त परिवार</div></div>
 </section>
</main>
<div id="yt"></div>
<button id="snd" autofocus title="शिव भजन शुरू करें" aria-label="Start Shiv bhajan">🔊</button>
<div id="nav"><button id="prv" title="पिछला गाना" aria-label="Previous song">⏮ पिछला गाना</button>
<button id="nxt" title="अगला गाना" aria-label="Next song">⏭ अगला गाना</button></div>
<script>
/* Background Shiv music from YouTube (needs internet). Audio-only uploads where possible (no film dialogue). Browsers block sound until one tap/OK press, hence the button.
   Plays the sources in order, then repeats. v = single video ID, l = playlist ID. A source that won't play is skipped. */
const SRC=[
 {v:"P2_z9fWQa7k"},                             // Amit Trivedi - Namo Namo (full audio)
 {v:"pU-pXgrA8zE"},                             // Arijit Singh - Har Har Gange (audio)
 {v:"LNvdL_SPjto"},                              // Ganga Dharaay Shiv Ganga Dharaay
 {v:"75buPuJ9rWU"},                              // Jai Jai Gange Namami (Namami Gange bhajan)
 {v:"qhSZFy2B5wE"},                             // Hanuman Ansh - Parvati (audio)
 {v:"xlNgOe8VL54"},                             // Hanuman Ansh - Aavagaman (full audio)
 {v:"0F0kWlKblSo"},                              // Hanuman Ansh - full audio jukebox
 {v:"O0scieT9bc0"},                             // Hanuman Ansh - all songs audio jukebox (2nd upload)
 {v:"G-ZrEhG6JxQ"},                             // Jagannath Chaka Nayana bhajan
 {v:"ZWFAoHUqfGY"},                             // Jagannath Chakka Nain Nilachal Vale
 {v:"7-h8jGwlR-M"},                              // Kailash Kher - Shivoham
 {v:"XbN7oeyrMAU"},                              // Shankar Mahadevan - popular Shiva songs jukebox
 {v:"cBLJpnq-bjM"},                              // Shankar Mahadevan - Shiv Tandav (Hi-Fi)
 {l:"PLyXHXSHxLqKwtSy5aUsOmdiEA5wCstkbv"},       // Anuradha Paudwal Shiv bhajans
 {v:"LoTmkf0coSk"},                              // Hariharan, Anuradha Paudwal, Suresh Wadkar jukebox
 {v:"qjsyO-kzZIY"},                             // Prayer bhajans of Lord Shiva - full audio jukebox
 {l:"PL89F893AC7208EA6D"},                       // Shiv Aarti Sangrah
 {l:"PLkATqEKojb1GVrrzvxaE_dFJXrT2Ma-Q0"},       // Om Shiv mantras
 {l:"PLNnsrbMKr2O1X0YCqwnttkOSqKPrEpA55"},       // Shiv bhajans
 {l:"PLwOqiCzUK-HdnCOO59TnuxWDiBRZ8i_Qu"}];      // Non-stop Shiv bhajan
let p,i=0;
const cur=()=>SRC[(i%SRC.length+SRC.length)%SRC.length];   // i can go negative when stepping back
const go=()=>{const s=cur();s.v?p.loadVideoById(s.v):p.loadPlaylist({listType:"playlist",list:s.l})};
window.onYouTubeIframeAPIReady=()=>{p=new YT.Player("yt",{playerVars:{playsinline:1},events:{
 onReady:go,
 onStateChange:e=>{if(e.data===1)snd.hidden=true;if(e.data===0){i++;go()}},
 onError:()=>{cur().v?(i++,go()):p.nextVideo()}}})};
const next=()=>{if(!p)return;const s=cur(),pl=s.l&&p.getPlaylist&&p.getPlaylist();if(pl&&p.getPlaylistIndex()<pl.length-1)p.nextVideo();else{i++;go()}};
const prev=()=>{if(!p)return;const s=cur(),pl=s.l&&p.getPlaylist&&p.getPlaylist();if(pl&&p.getPlaylistIndex()>0)p.previousVideo();else{i--;go()}};
nxt.onclick=next;prv.onclick=prev;
let hideT;const fs=()=>document.fullscreenElement||matchMedia("(display-mode: fullscreen)").matches||(innerWidth>=screen.width-1&&innerHeight>=screen.height-1);   // also catches F11
const reveal=()=>{if(fs()){nav.classList.remove("show");return}nav.classList.add("show");clearTimeout(hideT);hideT=setTimeout(()=>nav.classList.remove("show"),3000)};
["fullscreenchange","resize"].forEach(t=>addEventListener(t,()=>fs()&&nav.classList.remove("show")));
["pointermove","pointerdown","touchstart"].forEach(t=>addEventListener(t,reveal,{passive:true}));
document.onkeydown=e=>{reveal();if(e.key==="ArrowRight"||e.key==="MediaTrackNext"||e.key==="n")next();if(e.key==="ArrowLeft"||e.key==="MediaTrackPrevious"||e.key==="p")prev()};
snd.onclick=()=>p&&(p.getPlayerState()===1||p.playVideo());
document.head.appendChild(Object.assign(document.createElement("script"),{src:"https://www.youtube.com/iframe_api"}));
</script>
<canvas id="fw" aria-hidden="true"></canvas>
<script>
/* Skyshot show: runs non-stop in rounds of 50 shells (each round ends in a quick volley). Never drawn over the parents' photo. Canvas, no libraries. Skipped if the device asks for reduced motion. */
(()=>{
if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
const SHOTS=50,PAUSE=1500,START=3500,c=document.getElementById("fw"),x=c.getContext("2d");
let W,H,k;const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight;k=H/1080};fit();addEventListener("resize",fit);
const COL=[[255,214,102],[255,140,50],[255,90,140],[255,255,255],[120,255,160],[120,190,255],[200,120,255]];
const R=Math.random,rockets=[],parts=[];let fired=0,nextAt=performance.now()+START,last=performance.now();
const no={x:0,y:0,w:0,h:0};   // parents' photo box: nothing is drawn here
const upd=()=>{const e=document.querySelector(".par");if(e){const r=e.getBoundingClientRect();no.x=r.left;no.y=r.top;no.w=r.width;no.h=r.height}};
upd();addEventListener("resize",upd);setInterval(upd,600);
const hit=(px,py,m)=>px>no.x-m&&px<no.x+no.w+m&&py>no.y-m&&py<no.y+no.h+m;
function launch(){fired++;let bx,ty,t=0;do{bx=W*(.12+.76*R());ty=H*(.1+.35*R())}while(t++<8&&hit(bx,ty,120*k));
 rockets.push({x:bx,y:H,vx:(R()-.5)*1.4*k,vy:-(11+5*R())*k,ty})}
function burst(px,py){
 const col=COL[R()*COL.length|0],alt=R()<.35?COL[R()*COL.length|0]:col,n=100+(R()*60|0),sp=(4+3.5*R())*k,willow=R()<.25;
 for(let i=0;i<n;i++){const a=R()*6.2832,s=(.7+.3*R())*sp;
  parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:(willow?120:70)+R()*40,c:i%3?col:alt,g:willow?.035:.05})}
}
function frame(now){
 const dt=Math.min((now-last)/16.7,3);last=now;
 if(fired<SHOTS&&now>=nextAt){launch();nextAt=now+(fired>40?120+230*R():450+800*R())}
 if(fired>=SHOTS&&nextAt<now){fired=0;nextAt=now+PAUSE}
 if(!rockets.length&&!parts.length){x.clearRect(0,0,W,H);requestAnimationFrame(frame);return}
 x.save();x.beginPath();x.rect(0,0,W,H);x.rect(no.x,no.y,no.w,no.h);x.clip("evenodd");   // everything except the parents' photo
 x.globalCompositeOperation="destination-out";x.fillStyle="rgba(0,0,0,.2)";x.fillRect(0,0,W,H);   // fade = trails
 x.globalCompositeOperation="lighter";
 for(let i=rockets.length;i--;){const r=rockets[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy*=.992;
  x.fillStyle="rgba(255,225,160,.9)";x.beginPath();x.arc(r.x,r.y,2.2*k,0,6.2832);x.fill();
  if(r.y<=r.ty||r.vy>-2.5*k){burst(r.x,r.y);rockets.splice(i,1)}}
 for(let i=parts.length;i--;){const p=parts[i];p.l+=dt;if(p.l>=p.m){parts.splice(i,1);continue}
  p.vx*=Math.pow(.985,dt);p.vy=p.vy*Math.pow(.985,dt)+p.g*k*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  const a=1-p.l/p.m;x.fillStyle="rgba("+p.c[0]+","+p.c[1]+","+p.c[2]+","+a.toFixed(2)+")";
  x.beginPath();x.arc(p.x,p.y,(1.8+2.4*a)*k,0,6.2832);x.fill()}
 x.restore();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
