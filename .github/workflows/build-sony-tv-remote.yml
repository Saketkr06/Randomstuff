name: Build Sony TV Remote app

on:
  push:
    branches: [master]
    paths:
      - "sony-tv-remote/**"
      - ".github/workflows/build-sony-tv-remote.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sony-tv-remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle itself, so no wrapper files are needed in the repository.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sony-tv-remote
          path: sony-tv-remote/app/build/outputs/apk/debug/app-debug.apk
